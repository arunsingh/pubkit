name: release

# Publishes to PyPI via Trusted Publishing (OIDC).
#
# This is deliberate, and it mirrors the philosophy of the tool itself: there is
# no PyPI API token anywhere. GitHub proves the workflow's identity to PyPI
# directly, so there is no long-lived secret to leak, rotate or accidentally
# commit. Set it up once at https://pypi.org/manage/account/publishing/ with:
#
#     PyPI project name : pubkit
#     Owner             : <your-github-username>
#     Repository        : pubkit
#     Workflow          : release.yml
#     Environment       : pypi
#
# Then tag a release and this does the rest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[dev,all]"
      - run: python -m playwright install chromium
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m pubkit.cli validate examples/inside-ai-infra

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag is the only thing a human types during a release, and it is
      # the one thing nothing else checks. v0.1.1 was cut before the version
      # bump and carried 0.1.0; v0.1.2 carried 0.1.1. Both reached the publish
      # step before anything complained. Fail here instead, in seconds,
      # before a build or an upload has happened.
      - name: Tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "tag=$GITHUB_REF_NAME  ->  $TAG"
          echo "pyproject version     ->  $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG"
            echo "Bump the version, commit it, then re-cut the tag at that commit."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata renders on PyPI
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pubkit
    permissions:
      id-token: write        # this is what Trusted Publishing needs
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already on PyPI becomes a no-op instead of a red
          # build. Tag names and package versions drift; a re-tag or a
          # re-run should not fail the release for that alone.
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: .github/release-body.md
