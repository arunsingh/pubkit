name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      # [all] matters: table rendering and the browser pool are optional
      # extras, and their tests silently skip without them. A green run that
      # skipped the code under test is not a green run.
      - run: pip install -e ".[dev,all]"
      - run: python -m playwright install chromium
      - run: ruff check src tests
      - run: pytest -q
      - name: Validate the bundled example against the real check pipeline
        run: python -m pubkit.cli validate examples/inside-ai-infra
