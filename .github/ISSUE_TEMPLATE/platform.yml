name: Platform request
description: Ask for a new adapter, or offer to write one.
labels: [adapter]
body:
  - type: input
    id: platform
    attributes: {label: Platform, placeholder: "Ghost, LinkedIn articles, Bluesky, Notion…"}
    validations: {required: true}
  - type: dropdown
    id: kind
    attributes:
      label: Does it have a public write API?
      options:
        - "Yes — documented API adapter"
        - "No — needs a browser adapter"
        - "Not sure"
    validations: {required: true}
  - type: input
    id: docs
    attributes: {label: Link to the API docs, if any}
  - type: textarea
    id: quirks
    attributes:
      label: Known quirks
      description: |
        Anything you already know it does badly: no tables, strips images, odd tag widget,
        aggressive rate limits. This is the most valuable part of the request — it is what
        the adapter's `Capabilities` will encode.
  - type: checkboxes
    id: offer
    attributes:
      label: Would you like to write it?
      options:
        - label: "Yes — point me at docs/ADAPTERS.md and I'll open a PR"
